services: # lists the applications to run
  node1:
    build:
      context: .
      dockerfile: Dockerfile.node
    image: storage-node:v2
    container_name: storage-node-1
    environment:
      NODE_ID: node-1
      STORAGE_PATH: /data
      STORAGE_CAPACITY_GB : "1"
    volumes:
      - node1_data:/data

    ports:
      - "8001:8000"
    restart: unless-stopped

  node2:
    image: storage-node:v2
    container_name: storage-node-2
    environment:
      NODE_ID: node-2
      STORAGE_PATH: /data
      STORAGE_CAPACITY_GB : "1"
    volumes:
      - node2_data:/data
    ports:
      - "8002:8000"
    restart: unless-stopped

  node3:
    image: storage-node:v2
    container_name: storage-node-3
    environment:
      NODE_ID: node-3
      STORAGE_PATH: /data
      STORAGE_CAPACITY_GB : "1"
    volumes:
      - node3_data:/data
    ports:
      - "8003:8000"
    restart: unless-stopped

  node4:
    image: storage-node:v2
    container_name: storage-node-4
    
    environment:
      NODE_ID: node-4
      STORAGE_PATH: /data
      STORAGE_CAPACITY_GB : "1"
    volumes:
      - node4_data:/data
    ports:
      - "8004:8000"
    restart: unless-stopped

  node5:
    image: storage-node:v2
    container_name: storage-node-5
    environment:
      NODE_ID: node-5
      STORAGE_PATH: /data
      STORAGE_CAPACITY_GB : "1"
    volumes:
      - node5_data:/data
    ports:
      - "8005:8000"
    restart: unless-stopped
volumes:
  node1_data:
  node2_data:
  node3_data:
  node4_data:
  node5_data: